          h("div",{class:"portal-card"},h("div",{class:"label"},"Offene Aufgaben"),h("div",{class:"big"},tasksR.data?.length||0)),
          h("div",{class:"portal-card"},h("div",{class:"label"},"Action Center"),h("div",{class:"big"},actionsR.data?.length||0)),
          h("div",{class:"portal-card"},h("div",{class:"label"},"KI-Verbrauch"),h("div",{class:"big"},usageR.data?((usageR.data.cost_cents||0)/100).toFixed(2)+" €":"0,00 €"))
        ),
        tasksR.data?.length?h("div",{class:"list"},tasksR.data.map(t=>
          h("div",{class:"item"},
            h("div",{class:"grow"},t.title,h("div",{class:"meta"},t.status+(t.due_at?" · "+fmt(t.due_at):""))),
            h("button",{class:"btn ghost sm",onclick:()=>openTab("tasks")},"Öffnen")
          )
        )):null
      )
    );
  };

  docs=async function(c){
    await oldDocs(c);
    const input=h("input",{type:"file",id:"venture-file"});
    const button=h("button",{class:"btn"},"Hochladen");
    button.onclick=async()=>{
      const file=input.files?.[0];
      if(!file)return alert("Bitte zuerst eine Datei auswählen.");
      button.disabled=true;
      try{
        const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
        const path=S.venture.id+"/"+crypto.randomUUID()+"-"+safe;
        const up=await sb.storage.from("venture-docs").upload(path,file,{upsert:false,contentType:file.type||"application/octet-stream"});
        if(up.error)throw up.error;
        const ins=await sb.from("documents").insert({
          venture_id:S.venture.id,name:file.name,storage_path:path,created_by:S.user.id,
          document_type:"file",processing_status:"pending",visibility:"customer",
          metadata:{mime_type:file.type,size:file.size}
        }).select("id").single();
        if(ins.error)throw ins.error;
        const ev=await sb.functions.invoke("venture-portal-orchestrator",{
          body:{venture_id:S.venture.id,event_type:"document.created",document_id:ins.data.id,idempotency_key:"document:"+ins.data.id}
        });
        if(ev.error)throw ev.error;
        docs(c);
      }catch(e){alert(e.message||"Upload fehlgeschlagen.");}
      button.disabled=false;
    };
    c.append(h("div",{class:"dropzone"},
      h("strong",{},"Dokument hinzufügen"),
      h("p",{class:"muted",style:"margin:5px 0 12px"},"Upload → Dokumenten-Agent → Gedächtnis / Aufgaben / AI-Verarbeitung."),
      input,h("div",{style:"margin-top:10px"},button)
    ));
  };

  async function actionCenter(c){
    const [a,n]=await Promise.all([
      sb.from("portal_action_center").select("*").eq("venture_id",S.venture.id).order("created_at",{ascending:false}).limit(50),
      sb.from("portal_notifications").select("*").eq("venture_id",S.venture.id).is("read_at",null).order("created_at",{ascending:false}).limit(20)
    ]);
    c.replaceChildren(
      h("div",{class:"hero"},h("div",{},h("h2",{},"Action Center"),h("p",{class:"muted"},"Aufgaben, Freigaben und Benachrichtigungen an einem Ort."))),
      h("div",{class:"grid"},
        h("section",{class:"card"},h("h3",{},"Offene Aktionen"),
          h("div",{class:"list"},(a.data||[]).map(x=>h("div",{class:"item"},
            h("div",{class:"grow"},x.title,h("div",{class:"meta"},[x.status,x.priority?"Priorität "+x.priority:""].filter(Boolean).join(" · "))),
            h("span",{class:"chip"},x.source||"action")
          )))
        ),
        h("section",{class:"card"},h("h3",{},"Benachrichtigungen"),
          h("div",{class:"list"},(n.data||[]).map(x=>h("div",{class:"item"},
            h("div",{class:"grow"},x.title,h("div",{class:"meta"},fmtT(x.created_at))),
            h("button",{class:"btn ghost sm",onclick:async()=>{await sb.from("portal_notifications").update({read_at:new Date().toISOString()}).eq("id",x.id);actionCenter(c)}},"Gelesen")
          )))
        )
      )
    );
  }

  async function contacts(c){
    const {data}=await sb.from("venture_contacts").select("*,contact:portal_contacts(*)").eq("venture_id",S.venture.id);
    c.replaceChildren(
      h("h2",{},"Kontakte"),
      h("p",{class:"muted"},"Kontakte, die diesem Venture zugeordnet sind."),
      h("div",{class:"list"},(data||[]).map(x=>{
        const p=x.contact||{};
        return h("div",{class:"item"},
          h("div",{class:"grow"},
            h("strong",{},p.display_name||[p.first_name,p.last_name].filter(Boolean).join(" ")||p.company_name||"Kontakt"),
            h("div",{class:"meta"},[p.company_name,p.email,p.phone].filter(Boolean).join(" · "))
          ),
          h("span",{class:"chip"},x.relationship||"Kontakt")
        );
      }))
    );
  }

  async function adminPanel(c){
    if(!admin()){
      c.replaceChildren(h("div",{class:"card"},h("h2",{},"Kein Zugriff"),h("p",{class:"muted"},"Dieser Bereich ist nur für BLACKFJORD-Administratoren sichtbar.")));
      return;
    }
    const [health,queue,approvals,workflows,payments]=await Promise.all([
      sb.from("portal_agent_health").select("*").order("failures_24h",{ascending:false}),
      sb.from("portal_agent_queue").select("*").order("priority",{ascending:false}).limit(30),
      sb.from("venture_agent_approvals").select("*").eq("status","pending").order("created_at",{ascending:false}).limit(30),
      sb.from("portal_workflows").select("*").order("created_at",{ascending:false}).limit(30),
      sb.from("portal_payments").select("*").eq("venture_id",S.venture.id).order("created_at",{ascending:false}).limit(20)
    ]);

    const rows=(health.data||[]).map(x=>h("tr",{},
      h("td",{},x.name||x.key),h("td",{},x.status||"—"),h("td",{},x.runs_24h??0),h("td",{},x.failures_24h??0),h("td",{},x.last_run_at?fmtT(x.last_run_at):"—")
    ));
    const qrows=(queue.data||[]).map(x=>h("tr",{},
      h("td",{},x.job_type),h("td",{},x.status),h("td",{},x.attempt_count+"/"+x.max_attempts),h("td",{},x.priority)
    ));
    const arows=(approvals.data||[]).map(x=>h("div",{class:"item"},
      h("div",{class:"grow"},h("strong",{},x.title),h("div",{class:"meta"},x.action_type),x.description?h("div",{},x.description):null),
      h("button",{class:"btn sm",onclick:async()=>{await sb.from("venture_agent_approvals").update({status:"approved",decided_by:S.user.id,decided_at:new Date().toISOString()}).eq("id",x.id);adminPanel(c)}},"Freigeben"),
      h("button",{class:"btn ghost sm",onclick:async()=>{await sb.from("venture_agent_approvals").update({status:"rejected",decided_by:S.user.id,decided_at:new Date().toISOString()}).eq("id",x.id);adminPanel(c)}},"Ablehnen")
    ));

    c.replaceChildren(
      h("div",{class:"admin-head"},h("div",{},h("h2",{},"BLACKFJORD Admin"),h("p",{class:"muted"},"Agenten, Queue, Freigaben, Workflows und Zahlungen.")),h("span",{class:"badge"},"Admin")),
      h("section",{class:"card",style:"margin-top:14px"},h("h3",{},"Agent Health"),
        h("div",{class:"table-wrap"},h("table",{class:"portal-table"},
          h("thead",{},h("tr",{},h("th",{},"Agent"),h("th",{},"Status"),h("th",{},"Runs 24h"),h("th",{},"Fehler"),h("th",{},"Letzter Lauf"))),
          h("tbody",{},rows)
        ))
      ),
      h("section",{class:"card",style:"margin-top:14px"},h("h3",{},"Queue"),
        h("div",{class:"table-wrap"},h("table",{class:"portal-table"},
          h("thead",{},h("tr",{},h("th",{},"Job"),h("th",{},"Status"),h("th",{},"Versuche"),h("th",{},"Priorität"))),
          h("tbody",{},qrows)
        ))
      ),
      h("section",{class:"card",style:"margin-top:14px"},h("h3",{},"Offene Freigaben"),
        h("div",{class:"list"},arows.length?arows:h("p",{class:"muted"},"Keine offenen Freigaben."))
      ),
      h("section",{class:"card",style:"margin-top:14px"},h("h3",{},"Workflows"),
        h("div",{class:"list"},(workflows.data||[]).map(x=>h("div",{class:"item"},
          h("div",{class:"grow"},x.name,h("div",{class:"meta"},x.trigger_event)),h("span",{class:"chip"},x.status)
        )))
      ),
      h("section",{class:"card",style:"margin-top:14px"},h("h3",{},"Zahlungen"),
        h("div",{class:"table-wrap"},h("table",{class:"portal-table"},
          h("thead",{},h("tr",{},h("th",{},"Beschreibung"),h("th",{},"Betrag"),h("th",{},"Status"),h("th",{},"Fällig"))),
          h("tbody",{},(payments.data||[]).map(x=>h("tr",{},
            h("td",{},x.description||x.invoice_number||"—"),
            h("td",{},Number(x.amount||0).toFixed(2)+" "+(x.currency||"EUR")),
            h("td",{},x.status),h("td",{},x.due_at?fmt(x.due_at):"—")
          )))
        ))
      )
    );
  }

  renderTab=async function(c){
    if(S.tab==="action")return actionCenter(c);
    if(S.tab==="contacts")return contacts(c);
    if(S.tab==="admin")return adminPanel(c);
    return oldRenderTab(c);
  };
})();
</script>

sb.auth.onAuthStateChange((e)=>{if(e==="SIGNED_OUT")login()});load();
})();
</script>
</body>
</html>
